services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck: {test: ["CMD","mongosh","--eval","db.adminCommand('ping')"], interval: 10s, retries: 5}

  auth-service:
    build: ./services/auth-service
    image: crumbly/auth-service:latest
    ports: ["5001:5001"]
    environment:
      - PORT=5001
      - MONGO_URL=mongodb://mongo:27017/authdb
      - JWT_SECRET=${JWT_SECRET:-devsecret123}
      - INTERNAL_KEY=${INTERNAL_KEY:-devsecret123}
    depends_on: [mongo]

  listing-service:
    build: ./services/listing-service
    image: crumbly/listing-service:latest
    ports: ["5002:5002"]
    environment:
      - PORT=5002
      - MONGO_URL=mongodb://mongo:27017/maindb
      - NOTIFY_URL=http://notify-service:5004
    depends_on: [mongo]

  claim-service:
    build: ./services/claim-service
    image: crumbly/claim-service:latest
    ports: ["5003:5003"]
    environment:
      - PORT=5003
      - MONGO_URL=mongodb://mongo:27017/maindb
      - NOTIFY_URL=http://notify-service:5004
    depends_on: [mongo]

  notify-service:
    build: ./services/notify-service
    image: crumbly/notify-service:latest
    ports: ["5004:5004"]
    environment:
      - PORT=5004
      - MONGO_URL=mongodb://mongo:27017/maindb
      - GATEWAY_URL=http://api-gateway:8080
      - AUTH_URL=http://auth-service:5001
      - INTERNAL_KEY=${INTERNAL_KEY:-devsecret123}
    depends_on: [mongo]

  api-gateway:
    build: ./services/api-gateway
    image: crumbly/api-gateway:latest
    ports: ["8085:8080"]
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-devsecret123}
      - INTERNAL_KEY=${INTERNAL_KEY:-devsecret123}
      - AUTH_URL=http://auth-service:5001
      - LISTING_URL=http://listing-service:5002
      - CLAIM_URL=http://claim-service:5003
      - NOTIFY_URL=http://notify-service:5004
    depends_on: [auth-service, listing-service, claim-service, notify-service]

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8085}
    image: crumbly/frontend:latest
    ports: ["5173:80"]
    depends_on: [api-gateway]

  mongo-express:
    image: mongo-express:1
    ports: ["8081:8081"]
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
    depends_on: [mongo]

volumes:
  mongo-data:
