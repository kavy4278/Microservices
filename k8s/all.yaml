# --------------------------- api-gateway -----------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: {app: api-gateway, component: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata:
      labels: {app: api-gateway, component: gateway}
    spec:
      containers:
        - name: api-gateway
          image: annbachao/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT, value: "8080"}
            - name: AUTH_URL
              valueFrom: {configMapKeyRef: {name: annbachao-config, key: AUTH_URL}}
            - name: LISTING_URL
              valueFrom: {configMapKeyRef: {name: annbachao-config, key: LISTING_URL}}
            - name: CLAIM_URL
              valueFrom: {configMapKeyRef: {name: annbachao-config, key: CLAIM_URL}}
            - name: NOTIFY_URL
              valueFrom: {configMapKeyRef: {name: annbachao-config, key: NOTIFY_URL}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: annbachao-secrets, key: JWT_SECRET}}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels: {app: api-gateway, component: gateway}
spec:
  type: ClusterIP
  selector: {app: api-gateway}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
# ----------------------------- frontend ------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app: frontend, component: frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata:
      labels: {app: frontend, component: frontend}
    spec:
      containers:
        - name: frontend
          image: annbachao/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app: frontend, component: frontend}
spec:
  type: ClusterIP
  selector: {app: frontend}
  ports:
    - {name: http, port: 80, targetPort: 80}
---
# ----------------------------- ingress -------------------------------------
# Single external entry: UI on /, gateway API on /api (gateway serves /api/*,
# so paths pass through untouched — no rewrite). Requires an ingress controller.
# Alternative: change the api-gateway/frontend Services to type: LoadBalancer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: annbachao-ingress
  labels: {app: annbachao}
spec:
  rules:
    - host: annbachao.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: api-gateway, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {name: http}}
