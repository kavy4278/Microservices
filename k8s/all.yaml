# AnnBachao — complete Kubernetes manifest set
# ----------------------------------------------------------------------------
# Apply:      kubectl apply -f k8s/all.yaml
# Delete:     kubectl delete -f k8s/all.yaml
#
# Images: compose builds them as kavy_project-<svc>. For k8s, tag+push (or load):
#   docker build -t annbachao/auth-service:latest      services/auth-service
#   docker build -t annbachao/listing-service:latest   services/listing-service
#   docker build -t annbachao/claim-service:latest     services/claim-service
#   docker build -t annbachao/notify-service:latest    services/notify-service
#   docker build -t annbachao/api-gateway:latest       services/api-gateway
#   docker build --build-arg VITE_API_URL=/api \
#     -t annbachao/frontend:latest frontend
#   # single-node cluster:  minikube image load annbachao/...
#   # shared cluster:       docker push <registry>/annbachao/...
#
# Access (external): enable the ingress controller, then map the host, e.g.
#   minikube addons enable ingress && minikube tunnel
#   echo "127.0.0.1 annbachao.local" >> /etc/hosts   # or use the LoadBalancer IPs
#   open http://annbachao.local
# The frontend must be built with VITE_API_URL=/api so the Ingress can route
# /api/* to the gateway on the same host.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: annbachao-secrets
  labels: {app: annbachao, component: config}
type: Opaque
stringData:
  JWT_SECRET: change_this_long_random_secret   # override per environment
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: annbachao-config
  labels: {app: annbachao, component: config}
data:
  AUTH_URL: http://auth-service:5001
  LISTING_URL: http://listing-service:5002
  CLAIM_URL: http://claim-service:5003
  NOTIFY_URL: http://notify-service:5004
  MONGO_AUTH_URL: mongodb://mongo:27017/authdb
  MONGO_MAIN_URL: mongodb://mongo:27017/maindb
---
# ----------------------------- database ------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  labels: {app: mongo, component: database}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels: {app: mongo, component: database}
spec:
  replicas: 1
  # RWO PVC: old and new mongo cannot share /data/db, so a rolling update
  # would deadlock (new pod can't start, old won't die). Recreate avoids that.
  strategy: {type: Recreate}
  selector: {matchLabels: {app: mongo}}
  template:
    metadata:
      labels: {app: mongo, component: database}
    spec:
      containers:
        - name: mongo
          image: mongo:7
          imagePullPolicy: IfNotPresent
          ports:
            - {name: mongo, containerPort: 27017}
          env:
            - {name: MONGO_INITDB_DATABASE, value: maindb}
          volumeMounts:
            - {name: data, mountPath: /data/db}
          readinessProbe:
            exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mongo-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels: {app: mongo, component: database}
spec:
  type: ClusterIP
  selector: {app: mongo}
  ports:
    - {name: mongo, port: 27017, targetPort: 27017}
---
# --------------------------- auth-service ----------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels: {app: auth-service, component: backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata:
      labels: {app: auth-service, component: backend}
    spec:
      containers:
        - name: auth-service
          image: annbachao/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5001}
          env:
            - {name: PORT, value: "5001"}
            - name: MONGO_URL
              valueFrom: {configMapKeyRef: {name: annbachao-config, key: MONGO_AUTH_URL}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: annbachao-secrets, key: JWT_SECRET}}
          readinessProbe:
            httpGet: {path: /health, port: 5001}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5001}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels: {app: auth-service, component: backend}
spec:
  type: ClusterIP
  selector: {app: auth-service}
  ports:
    - {name: http, port: 5001, targetPort: 5001}
---
