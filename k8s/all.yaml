              valueFrom: {configMapKeyRef: {name: annbachao-config, key: MONGO_MAIN_URL}}
          readinessProbe:
            httpGet: {path: /health, port: 5002}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5002}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
