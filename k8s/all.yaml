apiVersion: apps/v1
kind: Deployment
metadata: {name: mongo}
spec:
  replicas: 1
  selector: {matchLabels: {app: mongo}}
  template:
    metadata: {labels: {app: mongo}}
    spec: {containers: [{name: mongo, image: mongo:7, ports: [{containerPort: 27017}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: mongo}
spec: {selector: {app: mongo}, ports: [{port: 27017}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata: {labels: {app: auth-service}}
    spec: {containers: [{name: auth-service, image: annbachao/auth-service:latest, ports: [{containerPort: 5001}], env: [{name: MONGO_URL, value: mongodb://mongo:27017/authdb}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: auth-service}
spec: {selector: {app: auth-service}, ports: [{port: 5001}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: listing-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: listing-service}}
  template:
    metadata: {labels: {app: listing-service}}
    spec: {containers: [{name: listing-service, image: annbachao/listing-service:latest, ports: [{containerPort: 5002}], env: [{name: MONGO_URL, value: mongodb://mongo:27017/maindb}], livenessProbe: {httpGet: {path: /health, port: 5002}, initialDelaySeconds: 15, periodSeconds: 20}}]}
---
apiVersion: v1
kind: Service
metadata: {name: listing-service}
spec: {selector: {app: listing-service}, ports: [{port: 5002}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec: {containers: [{name: gateway, image: annbachao/api-gateway:latest, ports: [{containerPort: 8080}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec: {type: LoadBalancer, selector: {app: gateway}, ports: [{port: 8080}]}
